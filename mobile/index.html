<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d0f1a" />
  <title>GamePad Remote Controller</title>
  <meta name="description" content="Turn your Android phone into a wireless game controller for your laptop." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Connection Screen -->
  <div id="connect-screen" class="screen active">
    <div class="connect-card">
      <div class="logo">
        <div class="logo-icon">🎮</div>
        <h1>GamePad</h1>
        <p class="subtitle">Phone → Laptop Controller</p>
      </div>

      <!-- Transport Mode Toggle -->
      <div class="transport-selector">
        <button type="button" id="tab-ws" class="transport-btn active">📡 Wi-Fi (WebSocket)</button>
        <button type="button" id="tab-ble" class="transport-btn">ᛒ Bluetooth LE</button>
      </div>

      <!-- WebSocket Form -->
      <div id="ws-form" class="connect-form">
        <div class="input-group">
          <label for="server-ip">Laptop IP Address</label>
          <input type="text" id="server-ip" placeholder="e.g. 192.168.1.10" autocomplete="off" />
        </div>
        <div class="input-group">
          <label for="server-port">Port</label>
          <input type="number" id="server-port" value="8765" min="1024" max="65535" />
        </div>
        <button id="connect-btn" class="btn-primary">
          <span class="btn-text">Connect (Wi-Fi)</span>
          <span class="btn-loader hidden">⟳</span>
        </button>
        <div id="connect-error" class="error-msg hidden"></div>
      </div>

      <!-- Bluetooth Form -->
      <div id="ble-form" class="connect-form hidden">
        <p class="ble-hint">Pairs wirelessly via Web Bluetooth. Requires Chrome on Android with Bluetooth enabled.</p>
        <button id="ble-connect-btn" class="btn-primary btn-ble">
          <span class="btn-text">ᛒ Pair Bluetooth Controller</span>
          <span class="btn-loader hidden">⟳</span>
        </button>
        <div id="ble-error" class="error-msg hidden"></div>
      </div>

      <div class="profile-selector-mini">
        <label>Active Profile</label>
        <select id="active-profile-mini">
          <option value="smash_karts">🏎️ Smash Karts</option>
          <option value="racing">🏁 Racing / Driving</option>
          <option value="wasd">⌨️ WASD Generic</option>
          <option value="arrows">⬆️ Arrow Keys</option>
          <option value="custom">⚙️ Custom</option>
        </select>
      </div>

      <button id="open-mapping-btn" class="btn-secondary">
        ⚙️ Edit Key Mappings
      </button>
    </div>
  </div>

  <!-- Controller Screen -->
  <div id="controller-screen" class="screen">
    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-left">
        <div id="connection-dot" class="status-dot disconnected"></div>
        <span id="connection-label">Disconnected</span>
      </div>
      <div class="status-center">
        <select id="layout-select" class="layout-select" title="Switch Controller Interface">
          <option value="action">🎮 Smash Karts / Action</option>
          <option value="racing">🏎️ Racing Cockpit (Pedals)</option>
          <option value="dpad">🧭 Retro 4-Way D-Pad</option>
          <option value="minimal">🚗 Simple Steer & Pedals</option>
        </select>
      </div>
      <div class="status-right">
        <span id="latency-display" class="latency">-- ms</span>
        <button id="disconnect-btn" class="icon-btn" title="Disconnect">⏏</button>
        <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
      </div>
    </div>

    <!-- Active Keys Display -->
    <div class="keys-hud">
      <div class="key-pill" id="hud-w">W</div>
      <div class="key-pill" id="hud-a">A</div>
      <div class="key-pill" id="hud-s">S</div>
      <div class="key-pill" id="hud-d">D</div>
      <div class="key-pill" id="hud-space">SPC</div>
      <div class="key-pill" id="hud-e">E</div>
    </div>

    <!-- Main Controller Area: Multi-Layout Container -->
    <div class="controller-area">

      <!-- ==============================================
           LAYOUT 1: SMASH KARTS / ACTION (Default)
           ============================================== -->
      <div id="layout-action" class="controller-layout active">
        <!-- Left: Joystick -->
        <div class="joystick-zone">
          <div id="joystick-base" class="joystick-base">
            <div class="joystick-ring"></div>
            <div id="joystick-thumb" class="joystick-thumb">
              <div class="joystick-inner"></div>
            </div>
            <div class="joystick-arrows">
              <span class="arr arr-top">▲</span>
              <span class="arr arr-right">▶</span>
              <span class="arr arr-bottom">▼</span>
              <span class="arr arr-left">◀</span>
            </div>
          </div>
          <div class="joystick-label">STEER / DRIVE</div>
        </div>

        <!-- Right: Action Buttons -->
        <div class="buttons-zone">
          <div class="buttons-grid">
            <div class="btn-row center-row">
              <div class="action-btn-wrap">
                <button id="btn-e" class="action-btn btn-yellow" data-action="special">
                  <span class="btn-icon">⚡</span>
                  <span class="btn-label" id="btn-e-label">SPECIAL</span>
                </button>
              </div>
            </div>
            <div class="btn-row middle-row">
              <div class="action-btn-wrap">
                <button id="btn-q" class="action-btn btn-blue" data-action="item">
                  <span class="btn-icon">🎯</span>
                  <span class="btn-label" id="btn-q-label">ITEM</span>
                </button>
              </div>
              <div class="action-btn-wrap fire-wrap">
                <button id="btn-fire" class="action-btn btn-fire" data-action="fire">
                  <span class="btn-icon">💥</span>
                  <span class="btn-label" id="btn-fire-label">FIRE</span>
                </button>
              </div>
            </div>
            <div class="btn-row bottom-row">
              <div class="action-btn-wrap">
                <button id="btn-shift" class="action-btn btn-purple" data-action="brake">
                  <span class="btn-icon">🛑</span>
                  <span class="btn-label" id="btn-shift-label">DRIFT</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ==============================================
           LAYOUT 2: RACING COCKPIT (Pedals + Steer)
           ============================================== -->
      <div id="layout-racing" class="controller-layout">
        <!-- Left: Steering Zone (Wheel / Analog Steer) -->
        <div class="racing-steer-zone">
          <div class="steer-buttons-wrap">
            <button id="btn-race-left" class="steer-btn" data-key="A" data-label="STEER LEFT">
              <span class="steer-icon">◀</span>
              <span class="steer-text">LEFT</span>
            </button>
            <button id="btn-race-right" class="steer-btn" data-key="D" data-label="STEER RIGHT">
              <span class="steer-icon">▶</span>
              <span class="steer-text">RIGHT</span>
            </button>
          </div>
          <div class="race-aux-wrap">
            <button id="btn-race-drift" class="race-aux-btn btn-purple" data-key="SHIFT">
              <span>💨 DRIFT</span>
            </button>
            <button id="btn-race-nitro" class="race-aux-btn btn-yellow" data-key="SPACE">
              <span>⚡ NITRO / FIRE</span>
            </button>
          </div>
        </div>

        <!-- Right: Accelerator & Brake Pedals -->
        <div class="racing-pedals-zone">
          <!-- Brake / Reverse Pedal -->
          <div class="pedal-wrap">
            <button id="btn-pedal-brake" class="pedal pedal-brake" data-key="S">
              <div class="pedal-treads">
                <span></span><span></span><span></span><span></span>
              </div>
              <div class="pedal-label">
                <span class="pedal-icon">🛑</span>
                <span class="pedal-title">BRAKE</span>
                <span class="pedal-sub">REVERSE</span>
              </div>
            </button>
          </div>

          <!-- Gas / Accelerator Pedal -->
          <div class="pedal-wrap">
            <button id="btn-pedal-gas" class="pedal pedal-gas" data-key="W">
              <div class="pedal-treads">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
              <div class="pedal-label">
                <span class="pedal-icon">⚡</span>
                <span class="pedal-title">GAS</span>
                <span class="pedal-sub">ACCEL</span>
              </div>
            </button>
          </div>
        </div>
      </div>

      <!-- ==============================================
           LAYOUT 3: RETRO 4-WAY D-PAD (Arcade / Platformers)
           ============================================== -->
      <div id="layout-dpad" class="controller-layout">
        <!-- Left: Authentic Cross D-Pad -->
        <div class="dpad-zone">
          <div class="dpad-cross">
            <button id="dpad-up" class="dpad-dir dpad-up" data-dir="up" data-key="W">
              <span>▲</span>
            </button>
            <div class="dpad-middle-row">
              <button id="dpad-left" class="dpad-dir dpad-left" data-dir="left" data-key="A">
                <span>◀</span>
              </button>
              <div class="dpad-center"></div>
              <button id="dpad-right" class="dpad-dir dpad-right" data-dir="right" data-key="D">
                <span>▶</span>
              </button>
            </div>
            <button id="dpad-down" class="dpad-dir dpad-down" data-dir="down" data-key="S">
              <span>▼</span>
            </button>
          </div>
          <div class="joystick-label">D-PAD</div>
        </div>

        <!-- Right: Classic 4-Button Action Cluster (ABXY) -->
        <div class="diamond-zone">
          <div class="diamond-grid">
            <button id="btn-diamond-y" class="diamond-btn btn-yellow" data-key="E">
              <span class="diamond-letter">Y</span>
            </button>
            <div class="diamond-middle">
              <button id="btn-diamond-x" class="diamond-btn btn-blue" data-key="Q">
                <span class="diamond-letter">X</span>
              </button>
              <button id="btn-diamond-b" class="diamond-btn btn-fire" data-key="SPACE">
                <span class="diamond-letter">B</span>
              </button>
            </div>
            <button id="btn-diamond-a" class="diamond-btn btn-green" data-key="SHIFT">
              <span class="diamond-letter">A</span>
            </button>
          </div>
        </div>
      </div>

      <!-- ==============================================
           LAYOUT 4: SIMPLE STEER & PEDALS (Minimalist)
           ============================================== -->
      <div id="layout-minimal" class="controller-layout">
        <!-- Left: Large Left / Right Steer Buttons -->
        <div class="minimal-steer-zone">
          <button id="btn-min-left" class="big-steer-btn" data-key="A">
            <span class="big-icon">◀◀</span>
            <span class="big-text">STEER LEFT</span>
          </button>
          <button id="btn-min-right" class="big-steer-btn" data-key="D">
            <span class="big-icon">▶▶</span>
            <span class="big-text">STEER RIGHT</span>
          </button>
        </div>

        <!-- Right: Large Gas & Brake Buttons -->
        <div class="minimal-pedals-zone">
          <button id="btn-min-brake" class="big-action-btn min-brake" data-key="S">
            <span class="big-icon">🛑</span>
            <span class="big-text">BRAKE</span>
          </button>
          <button id="btn-min-gas" class="big-action-btn min-gas" data-key="W">
            <span class="big-icon">⚡</span>
            <span class="big-text">GAS</span>
          </button>
        </div>
      </div>

    </div>

    <!-- Bottom Controls -->
    <div class="bottom-controls">
      <button id="reset-btn" class="util-btn">🔄 Reset</button>
      <div class="seq-counter">SEQ: <span id="seq-num">0</span></div>
      <button id="vibrate-btn" class="util-btn">📳 Haptics</button>
    </div>
  </div>

  <!-- Key Mapping Screen -->
  <div id="mapping-screen" class="screen">
    <div class="mapping-container">
      <div class="mapping-header">
        <button id="mapping-back-btn" class="back-btn">← Back</button>
        <h2>Key Mappings</h2>
        <button id="save-mapping-btn" class="btn-save">Save</button>
      </div>

      <div class="profile-tabs">
        <button class="tab-btn active" data-profile="smash_karts">🏎️ Smash Karts</button>
        <button class="tab-btn" data-profile="racing">🏁 Racing</button>
        <button class="tab-btn" data-profile="wasd">⌨️ WASD</button>
        <button class="tab-btn" data-profile="arrows">⬆️ Arrows</button>
        <button class="tab-btn" data-profile="custom">⚙️ Custom</button>
      </div>

      <div class="mapping-table-container">
        <table class="mapping-table">
          <thead>
            <tr>
              <th>Control</th>
              <th>Icon</th>
              <th>Key</th>
              <th>Mode</th>
            </tr>
          </thead>
          <tbody id="mapping-tbody">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>

      <div class="mapping-actions">
        <button id="reset-defaults-btn" class="btn-ghost">↺ Reset Defaults</button>
        <button id="test-mapping-btn" class="btn-ghost">🧪 Test</button>
      </div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="bluetooth.js"></script>
  <script src="key-mapping.js"></script>
  <script src="joystick.js"></script>
  <script src="controller.js"></script>
</body>
</html>
