name: 💡 Feature Request
description: Suggest an idea or enhancement for Phone Gamepad
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Phone Gamepad even better? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
    validations:
      required: false

  - type: textarea
    id: proposed_solution
    attributes:
      label: Describe the Solution You'd Like
      description: Detailed explanation of how this feature should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you considered.
    validations:
      required: false
